org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
kotlin.code.style=official

# Compose Hot Reload needs the JetBrains Runtime; let it fetch one itself
# (./gradlew :desktop:hotRun --auto).
compose.reload.jbr.autoProvisioningEnabled=true

# Idle build daemons go away after 15 minutes instead of 3 hours, and the
# Kotlin compiler's daemon has a ceiling, so parallel builds don't leave
# gigabytes of Java behind.
org.gradle.daemon.idletimeout=900000
kotlin.daemon.jvmargs=-Xmx2g
