Name: Octo
Summary: Music player for your Octo or Navidrome server
Description: |-
  Octo plays the music on your own server. It is made for Octo, a proxy that adds discovery to a Navidrome server, and it works with any Subsonic server too.

  With Octo:

  * Add songs, albums and search results you find to your library with one press.
  * One search for everything: your music first, then what Octo found, all playable at once.
  * Whole albums, with the songs you have marked and the rest one press away.
  * Stations on Home, and radio that reaches past your library.

  With any Subsonic server, it is a full player for the music you have: browse by artist, album, song, genre or folder, with favourites, ratings and playlists; synced lyrics, gapless playback, an equalizer with presets, ReplayGain and a sleep timer; and a queue that follows you between your phone and computer.
