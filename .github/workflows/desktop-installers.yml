# Builds the desktop installers on each system, since each is only made on
# its own: the MSI and a portable zip on Windows, the DMG on macOS, and the
# DEB, RPM, AppImage, Flatpak, pacman package and portable zip on Linux.
# Pull requests and manual runs build and check the same artifacts. On manual runs the
# installers are kept as the run's artifacts. On a desktop-v<version> tag
# (desktop-v1.2.0, or desktop-v1.3.0-beta.1 for an early version) they are
# also published, signed, as a release on the public Octo repository, where
# the installed apps find them (publish-player-release.yml).
name: desktop-installers

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/desktop-installers.yml'
      - '.github/workflows/publish-player-release.yml'
      - 'scripts/release/**'
      - 'desktop/**'
      - 'desktop-design/**'
      - 'design/**'
      - 'shared/**'
      - 'subsonic/**'
      - 'audio-engine/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
  push:
    tags: ["desktop-v*"]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      build: ${{ steps.tag.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Version from the tag
        id: tag
        run: |
          build=$(git rev-list --count HEAD)
          echo "build=$build" >> "$GITHUB_OUTPUT"
          version="1.0.$build"
          if [[ "$GITHUB_REF" == refs/tags/desktop-v* ]]; then
            version="${GITHUB_REF_NAME#desktop-v}"
            if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
              echo "::error::$GITHUB_REF_NAME must look like desktop-v1.2.0 or desktop-v1.3.0-beta.1."
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Release asset tests
        run: python3 scripts/release/release_assets.py self-test

  package:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            tasks: ":desktop:packageMsi :desktop:packagePortableZip"
          # macOS stays out until the Mac build has been opened on a Mac.
          # A fixed glibc baseline, also older than the Flatpak runtime.
          - os: ubuntu-24.04
            tasks: ":desktop:packageDeb :desktop:packageRpm :desktop:packagePortableZip :desktop:packageAppImage :desktop:packageFlatpak :desktop:packagePacman"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit count is the build number, as for the phone's test builds.
          fetch-depth: 0

      - name: Linux build packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config fakeroot rpm flatpak flatpak-builder \
            desktop-file-utils appstream libsecret-1-0 libasound2-plugins pulseaudio pulseaudio-utils xvfb zstd
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub org.freedesktop.Platform//26.08 org.freedesktop.Sdk//26.08

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Rust
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            audio-engine
            desktop/system-shim -> ../build/system-shim

      - name: Tests
        run: ./gradlew :desktop:test --no-daemon

      - name: Installers
        # The same version goes into the app, all packages and the manifest rehearsal.
        # Bash on every system: PowerShell splits -PoctoDesktopVersion=1.1.0 at its first dot.
        shell: bash
        run: ./gradlew ${{ matrix.tasks }} -PoctoBuild=${{ needs.version.outputs.build }} -PoctoDesktopVersion=${{ needs.version.outputs.version }} --no-daemon

      - name: Linux package smoke tests
        if: runner.os == 'Linux'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: bash desktop/packaging/linux/smoke-test.sh desktop/build/compose/binaries/main "$VERSION"

      - uses: actions/upload-artifact@v7
        with:
          # The system and chip, which name the files in the release.
          name: octo-desktop-${{ runner.os }}-${{ runner.arch }}
          path: |
            desktop/build/compose/binaries/main/msi/*.msi
            desktop/build/compose/binaries/main/dmg/*.dmg
            desktop/build/compose/binaries/main/deb/*.deb
            desktop/build/compose/binaries/main/rpm/*.rpm
            desktop/build/compose/binaries/main/zip/*.zip
            desktop/build/compose/binaries/main/appimage/*.AppImage
            desktop/build/compose/binaries/main/flatpak/*.flatpak
            desktop/build/compose/binaries/main/pacman/*.pkg.tar.zst
          if-no-files-found: error

  verify:
    needs: [version, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: octo-desktop-*
          path: artifacts
      - name: Rehearse release staging and manifest (no signing key or publishing token)
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          python3 scripts/release/release_assets.py stage-desktop --version "$VERSION" --artifacts artifacts --out release \
            --require-platform windows-x64 --require-platform linux-x64
          python3 scripts/release/release_assets.py manifest --app desktop --tag "desktop-v$VERSION" --notes README.md --dir release
          cd release
          sha256sum --check SHA256SUMS

  publish:
    needs: [version, verify]
    if: github.repository == 'winters27/octo-player' && startsWith(github.ref, 'refs/tags/desktop-v') && github.event_name != 'pull_request'
    uses: ./.github/workflows/publish-player-release.yml
    with:
      app: desktop
      tag: ${{ github.ref_name }}
      artifacts: octo-desktop-*
    secrets:
      OCTO_RELEASES_TOKEN: ${{ secrets.OCTO_RELEASES_TOKEN }}
      OCTO_UPDATE_SIGNING_KEY: ${{ secrets.OCTO_UPDATE_SIGNING_KEY }}
