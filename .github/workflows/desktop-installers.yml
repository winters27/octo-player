# Builds the desktop installers on each system, since each is only made on
# its own: the MSI and a portable zip on Windows, the DMG on macOS, and the
# DEB, RPM and a portable zip on Linux. Run by hand from the Actions tab, or
# on a version tag. The installers are kept as the run's artifacts; nothing
# is published.
name: desktop-installers

on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            tasks: ":desktop:packageMsi :desktop:packagePortableZip"
          - os: macos-latest
            tasks: ":desktop:packageDmg"
          - os: ubuntu-latest
            tasks: ":desktop:packageDeb :desktop:packageRpm :desktop:packagePortableZip"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit count is the build number, as for the phone's test builds.
          fetch-depth: 0

      - name: Linux build packages
        if: runner.os == 'Linux'
        # ALSA headers for the audio engine, and the tools the DEB and RPM need.
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config fakeroot rpm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Rust
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            audio-engine
            desktop/system-shim -> ../build/system-shim

      - name: Build number
        shell: bash
        run: echo "OCTO_BUILD=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Tests
        run: ./gradlew :desktop:test --no-daemon

      - name: Installers
        run: ./gradlew ${{ matrix.tasks }} -PoctoBuild=${{ env.OCTO_BUILD }} --no-daemon

      - uses: actions/upload-artifact@v7
        with:
          name: octo-desktop-${{ runner.os }}
          path: |
            desktop/build/compose/binaries/main/msi/*.msi
            desktop/build/compose/binaries/main/dmg/*.dmg
            desktop/build/compose/binaries/main/deb/*.deb
            desktop/build/compose/binaries/main/rpm/*.rpm
            desktop/build/compose/binaries/main/zip/*.zip
          if-no-files-found: error
