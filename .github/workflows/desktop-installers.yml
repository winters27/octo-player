# Builds the desktop installers on each system, since each is only made on
# its own: the MSI and a portable zip on Windows, the DMG on macOS, and the
# DEB, RPM and a portable zip on Linux. Run by hand from the Actions tab, the
# installers are kept as the run's artifacts. On a desktop-v<version> tag
# (desktop-v1.2.0, or desktop-v1.3.0-beta.1 for an early version) they are
# also published, signed, as a release on the public Octo repository, where
# the installed apps find them (publish-player-release.yml).
name: desktop-installers

on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Version from the tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/desktop-v* ]]; then
            version="${GITHUB_REF_NAME#desktop-v}"
            if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
              echo "::error::$GITHUB_REF_NAME must look like desktop-v1.2.0 or desktop-v1.3.0-beta.1."
              exit 1
            fi
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi

  package:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            tasks: ":desktop:packageMsi :desktop:packagePortableZip"
          # macOS stays out until the Mac build has been opened on a Mac.
          - os: ubuntu-latest
            tasks: ":desktop:packageDeb :desktop:packageRpm :desktop:packagePortableZip"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit count is the build number, as for the phone's test builds.
          fetch-depth: 0

      - name: Linux build packages
        if: runner.os == 'Linux'
        # ALSA headers for the audio engine, and the tools the DEB and RPM need.
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config fakeroot rpm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Rust
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            audio-engine
            desktop/system-shim -> ../build/system-shim

      - name: Build number
        shell: bash
        run: echo "OCTO_BUILD=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Tests
        run: ./gradlew :desktop:test --no-daemon

      - name: Installers
        # A tag's version (none when run by hand) goes into the app and its installers.
        # Bash on every system: PowerShell splits -PoctoDesktopVersion=1.1.0 at its first dot.
        shell: bash
        run: ./gradlew ${{ matrix.tasks }} -PoctoBuild=${{ env.OCTO_BUILD }} ${{ needs.version.outputs.version && format('-PoctoDesktopVersion={0}', needs.version.outputs.version) || '' }} --no-daemon

      - uses: actions/upload-artifact@v7
        with:
          # The system and chip, which name the files in the release.
          name: octo-desktop-${{ runner.os }}-${{ runner.arch }}
          path: |
            desktop/build/compose/binaries/main/msi/*.msi
            desktop/build/compose/binaries/main/dmg/*.dmg
            desktop/build/compose/binaries/main/deb/*.deb
            desktop/build/compose/binaries/main/rpm/*.rpm
            desktop/build/compose/binaries/main/zip/*.zip
          if-no-files-found: error

  publish:
    needs: [version, package]
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    uses: ./.github/workflows/publish-player-release.yml
    with:
      app: desktop
      tag: ${{ github.ref_name }}
      artifacts: octo-desktop-*
    secrets:
      OCTO_RELEASES_TOKEN: ${{ secrets.OCTO_RELEASES_TOKEN }}
      OCTO_UPDATE_SIGNING_KEY: ${{ secrets.OCTO_UPDATE_SIGNING_KEY }}
