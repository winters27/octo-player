# Gathers the player releases of one version from the public Octo repository (winters27/octo)
# into a single release on this repository: "Octo Player <version>", tag v<version>, with every
# app's files and one changelog, a section per app. winters27/octo keeps a release per app,
# because that is what the installed apps update from; this one is for people who come here.
#
# Called by the Android, desktop and iPhone release workflows once their release is out (each
# call adds that app and rebuilds the notes from every app released so far), and can be run by
# hand with any app tag of the version. The tag v<version> must already be here, on the app
# tags' commit.
name: mirror-player-release

on:
  workflow_call:
    inputs:
      tag:
        description: An app tag of the version, such as android-v1.13.0.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: An app tag of the version, such as android-v1.13.0.
        required: true
        type: string

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    concurrency:
      # One at a time, so two apps of a version never write its release together. A waiting run
      # that a newer one replaces loses nothing: each run gathers every app published so far.
      group: player-release
      cancel-in-progress: false
    env:
      TAG: ${{ inputs.tag }}
      SOURCE: winters27/octo
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Gather the version's release here
        run: |
          case "$TAG" in
            android-v*|desktop-v*|ios-v*) ;;
            *) echo "::error::$TAG is not a player release tag."; exit 1 ;;
          esac
          version="${TAG#*-v}"
          release="v$version"
          title="Octo Player $version"
          # The version tag is pushed with the app tags: this job's token may not make a tag on
          # a commit that changes workflow files.
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$release" > /dev/null 2>&1; then
            echo "::error::Tag $release is not on $GITHUB_REPOSITORY; push it with the app tags (same commit)."
            exit 1
          fi
          mkdir -p files
          {
            echo "The Octo apps for your Octo server, version $version. Pick your device's file below; the apps you have installed update themselves."
            echo
          } > notes.md
          apps=0
          for app in android desktop ios; do
            app_tag="$app-v$version"
            draft=$(gh release view "$app_tag" --repo "$SOURCE" --json isDraft --jq .isDraft 2>/dev/null || true)
            [ "$draft" = false ] || continue
            name=$(gh release view "$app_tag" --repo "$SOURCE" --json name --jq .name)
            echo "## $name" >> notes.md
            echo >> notes.md
            # The notes open with their own title; the heading above already says it.
            gh release view "$app_tag" --repo "$SOURCE" --json body --jq .body |
              awk -v title="$name" 'NR == 1 && $0 == title { skip = 1; next } skip && NR == 2 && $0 == "" { next } { print }' >> notes.md
            echo >> notes.md
            gh release download "$app_tag" --repo "$SOURCE" --dir "download-$app"
            # Each app's manifest and checksums are for its updater on winters27/octo; this
            # release gets one checksum list for all of its files instead.
            rm -f "download-$app/SHA256SUMS" "download-$app/update.json" "download-$app/update.json.sig"
            mv "download-$app"/* files/
            apps=$((apps + 1))
          done
          if [ "$apps" -eq 0 ]; then
            echo "::error::No app of version $version is published on $SOURCE."
            exit 1
          fi
          (cd files && sha256sum -- * > ../SHA256SUMS) && mv SHA256SUMS files/
          early=()
          case "$version" in *-*) early=(--prerelease) ;; esac
          if gh release view "$release" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$release" files/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$release" --repo "$GITHUB_REPOSITORY" --title "$title" --notes-file notes.md
          else
            # A draft first, so no one sees the release before all its files are there.
            gh release create "$release" files/* --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
              --title "$title" --notes-file notes.md "${early[@]}"
            gh release edit "$release" --repo "$GITHUB_REPOSITORY" --draft=false
          fi
          want=$(cd files && ls | sort | tr '\n' ' ')
          have=$(gh release view "$release" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name] | sort | join(" ")')
          for file in $want; do
            case " $have " in *" $file "*) ;; *) echo "::error::$release lacks $file."; exit 1 ;; esac
          done
          echo "$release holds $apps app(s) of version $version: $want"
