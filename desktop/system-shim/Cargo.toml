[package]
name = "octo-system"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "The Octo desktop app's hooks into Windows and macOS: the system media controls and sleep."
license = "GPL-3.0-or-later"
publish = false

[lib]
name = "octo_system"
crate-type = ["cdylib", "rlib"]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Foundation",
    "Foundation_Collections",
    "Media",
    "Media_Control",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_WinRT",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-media-player = { version = "0.3.2", features = ["block2", "objc2-app-kit", "objc2-core-foundation"] }
block2 = "0.6.2"
dispatch2 = "0.3.1"

[profile.release]
opt-level = "s"
lto = true
strip = true
